<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Food Study & Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff8ef;color:#2d2520}
.wrap{max-width:1050px;margin:0 auto;padding:28px 18px 40px}
header{text-align:center;margin-bottom:20px}
h1{margin:0 0 8px;font-size:32px}
.subtitle{margin:0;color:#75685f}

/* 상단 탭 버튼 */
.tab-nav{display:flex;justify-content:center;gap:12px;margin:20px 0 26px}
.tab-btn{border:2px solid #302923;border-radius:999px;padding:12px 24px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff;color:#302923;transition:all .2s}
.tab-btn.active{background:#302923;color:#fff}

/* 탭 콘텐츠 영역 */
.tab-content{display:none}
.tab-content.active{display:block}

/* 1. 플래시카드 스타일 */
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.controls button{border:0;border-radius:999px;padding:11px 18px;font-size:15px;cursor:pointer;background:#302923;color:#fff}
.controls button.secondary{background:#eadfd2;color:#302923}
.progress{text-align:center;margin-bottom:16px;font-weight:bold;color:#75685f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{min-height:285px;perspective:1000px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;min-height:285px;transition:transform .5s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-shadow:0 7px 20px rgba(70,45,20,.10)}
.front{background:#fff}
.back{background:#fff0cf;transform:rotateY(180deg);justify-content:center;padding:18px}
.photo{width:100%;height:205px;object-fit:cover;display:block}
.tap{padding:16px 10px;font-size:15px;color:#75685f}
.ko{font-size:38px;font-weight:800;margin-bottom:8px}
.en{font-size:20px;color:#6d5b4d;text-align:center}

/* 2. 퀴즈 스타일 */
.quiz-card{max-width:600px;margin:0 auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 7px 20px rgba(70,45,20,.10);text-align:center}
.image-container{width:100%;max-width:320px;height:240px;margin:0 auto 20px;border-radius:16px;overflow:hidden;background:#f5efe6}
.image-container img{width:100%;height:100%;object-fit:cover;display:block}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.option-btn{background:#f8f2ea;border:2px solid #eadfd2;border-radius:14px;padding:14px;font-size:18px;font-weight:bold;color:#302923;cursor:pointer;transition:all .2s}
.option-btn:hover:not(:disabled){background:#eadfd2}
.option-btn.correct{background:#4caf50;color:#fff;border-color:#4caf50}
.option-btn.wrong{background:#f44336;color:#fff;border-color:#f44336}
.option-btn:disabled{cursor:default}
.status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:bold;color:#75685f}
.next-btn,.restart-btn{background:#302923;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:16px;cursor:pointer;margin:0 auto}
.next-btn{display:none}
.result-screen{text-align:center;display:none}

@media(max-width:500px){
 h1{font-size:26px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .card,.inner{min-height:250px}.photo{height:170px}.ko{font-size:30px}.en{font-size:16px}
 .options-grid{grid-template-columns:1fr}.image-container{height:200px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>🇰🇷 Korean Food Study</h1>
 <p class="subtitle">Learn Korean food vocabulary and test your knowledge!</p>
</header>

<!-- 상단 탭 메인 메뉴 -->
<div class="tab-nav">
 <button class="tab-btn active" onclick="switchTab('flashcard')">🎴 Flashcards</button>
 <button class="tab-btn" onclick="switchTab('quiz')">✏️ Quiz Mode</button>
</div>

<!-- TAB 1: 플래시카드 -->
<div id="flashcardTab" class="tab-content active">
 <div class="controls">
  <button onclick="shuffleCards()">🔀 Shuffle</button>
  <button class="secondary" onclick="flipAll()">👀 Show / Hide All</button>
 </div>
 <div class="progress" id="progress">0 / 10 learned</div>
 <div class="grid" id="grid"></div>
</div>

<!-- TAB 2: 퀴즈 -->
<div id="quizTab" class="tab-content">
 <div class="quiz-card" id="quizCard">
  <div class="status-bar">
   <span id="questionNum">Question 1 / 10</span>
   <span id="score">Score: 0</span>
  </div>
  <div class="image-container">
   <img id="foodImg" src="" alt="Food Image">
  </div>
  <div class="options-grid" id="optionsGrid"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question ➔</button>
 </div>

 <div class="quiz-card result-screen" id="resultScreen">
  <h2>🎉 Quiz Complete!</h2>
  <p id="finalScore" style="font-size:20px;margin:20px 0;"></p>
  <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
 </div>
</div>

</div>

<script>
// 데이터 공통 사용
const foods = [
 {ko:"밥", en:"Rice", img:"korean_food_flashcards_assets/bap.jpg"},
 {ko:"빵", en:"Bread", img:"korean_food_flashcards_assets/ppang.jpg"},
 {ko:"김치", en:"Kimchi", img:"korean_food_flashcards_assets/kimchi.jpg"},
 {ko:"비빔밥", en:"Bibimbap", img:"korean_food_flashcards_assets/bibimbap.jpg"},
 {ko:"불고기", en:"Bulgogi", img:"korean_food_flashcards_assets/bulgogi.jpg"},
 {ko:"김밥", en:"Gimbap", img:"korean_food_flashcards_assets/gimbap.jpg"},
 {ko:"떡볶이", en:"Tteokbokki", img:"korean_food_flashcards_assets/tteokbokki.jpg"},
 {ko:"만두", en:"Dumplings", img:"korean_food_flashcards_assets/mandu.jpg"},
 {ko:"라면", en:"Ramyeon", img:"korean_food_flashcards_assets/ramyeon.jpg"},
 {ko:"치킨", en:"Korean Fried Chicken", img:"korean_food_flashcards_assets/chicken.jpg"}
];

// 탭 전환 로직
function switchTab(tabName) {
 const tabs = document.querySelectorAll('.tab-content');
 const btns = document.querySelectorAll('.tab-btn');
 
 tabs.forEach(tab => tab.classList.remove('active'));
 btns.forEach(btn => btn.classList.remove('active'));

 if (tabName === 'flashcard') {
  document.getElementById('flashcardTab').classList.add('active');
  btns[0].classList.add('active');
 } else {
  document.getElementById('quizTab').classList.add('active');
  btns[1].classList.add('active');
  startQuiz(); // 퀴즈 탭 클릭 시 퀴즈 초기화 및 시작
 }
}

// --- 1. 플래시카드 로직 ---
let learned = new Set(), currentCards = [...foods], allShown = false;

function renderCards() {
 const grid = document.getElementById("grid"); 
 grid.innerHTML = "";
 currentCards.forEach(f => {
  const card = document.createElement("div");
  card.className = "card" + (learned.has(f.ko) ? " flipped" : "");
  card.innerHTML = `<div class="inner">
   <div class="face front"><img class="photo" src="${f.img}" alt="${f.en}"><div class="tap">Click me!</div></div>
   <div class="face back"><div class="ko">${f.ko}</div><div class="en">${f.en}</div></div>
  </div>`;
  card.onclick = () => {
   card.classList.toggle("flipped");
   if(card.classList.contains("flipped")) learned.add(f.ko);
   else learned.delete(f.ko);
   updateProgress();
  };
  grid.appendChild(card);
 });
 updateProgress();
}
function updateProgress() { document.getElementById("progress").textContent = `${learned.size} / ${foods.length} learned`; }
function shuffleCards() { currentCards.sort(() => Math.random() - 0.5); renderCards(); }
function flipAll() { allShown = !allShown; if(allShown) foods.forEach(f => learned.add(f.ko)); else learned.clear(); renderCards(); }

// --- 2. 퀴즈 로직 ---
let currentIndex = 0, score = 0, quizList = [];

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function startQuiz() {
 currentIndex = 0; score = 0;
 quizList = shuffle([...foods]);
 document.getElementById("quizCard").style.display = "block";
 document.getElementById("resultScreen").style.display = "none";
 loadQuestion();
}

function loadQuestion() {
 const currentFood = quizList[currentIndex];
 document.getElementById("questionNum").textContent = `Question ${currentIndex + 1} / ${foods.length}`;
 document.getElementById("score").textContent = `Score: ${score}`;
 document.getElementById("foodImg").src = currentFood.img;
 document.getElementById("nextBtn").style.display = "none";

 const otherFoods = foods.filter(f => f.ko !== currentFood.ko);
 const wrongOptions = shuffle(otherFoods).slice(0, 3);
 const options = shuffle([currentFood, ...wrongOptions]);

 const grid = document.getElementById("optionsGrid");
 grid.innerHTML = "";

 options.forEach(opt => {
  const btn = document.createElement("button");
  btn.className = "option-btn";
  btn.textContent = opt.ko;
  btn.onclick = () => checkAnswer(btn, opt.ko === currentFood.ko);
  grid.appendChild(btn);
 });
}

function checkAnswer(selectedBtn, isCorrect) {
 const buttons = document.querySelectorAll(".option-btn");
 buttons.forEach(btn => btn.disabled = true);

 if (isCorrect) {
  selectedBtn.classList.add("correct");
  score += 10;
  document.getElementById("score").textContent = `Score: ${score}`;
 } else {
  selectedBtn.classList.add("wrong");
  const currentFood = quizList[currentIndex];
  buttons.forEach(btn => {
   if (btn.textContent === currentFood.ko) btn.classList.add("correct");
  });
 }
 document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
 currentIndex++;
 if (currentIndex < quizList.length) loadQuestion();
 else showResult();
}

function showResult() {
 document.getElementById("quizCard").style.display = "none";
 document.getElementById("resultScreen").style.display = "block";
 document.getElementById("finalScore").textContent = `Your final score is ${score} / ${foods.length * 10}!`;
}

function restartQuiz() { startQuiz(); }

// 초기 실행
renderCards();
</script>
</body>
</html>
